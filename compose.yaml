services:
  postgresql:
    image: postgres@sha256:29ee7bb30d804447dc9a91fd0d74322ae1dc3a4072cc6346f70a5ed6e783b565 # 18.1
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: python_template
    ports:
      - "5432:5432"
    volumes:
      - postgres-sql:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-sql:
