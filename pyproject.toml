[project]
name = "python-template"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "azure-monitor-opentelemetry>=1.8.9",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.139.0",
    "greenlet>=3.5.3",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.39",
    "wirio>=0.24.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
